name: Build RaceManager Package

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tag action needs full history

      # --- Optional: auto-increment version ---
      - name: Bump version
        id: version
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true

      # --- Build client/RaceManager.zip (stays zipped) ---
      - name: Create client zip
        run: |
          mkdir -p package/client
          zip package/client/RaceManager.zip \
            lua/ge/extensions/raceManager.lua \
            scripts/raceManager/modScript.lua \
            ui/modules/apps/RaceManager/app.html \
            ui/modules/apps/RaceManager/app.js \
            ui/modules/apps/RaceManager/app.json

      # --- Copy server folder (stays unzipped) ---
      - name: Copy server files
        run: |
          mkdir -p package/server/RaceManager
          cp server/RaceManager/raceManager.lua package/server/RaceManager/

      # --- Create the main downloadable zip ---
      - name: Create main zip
        run: |
          cd package
          zip -r ../RaceManager-${{ steps.version.outputs.new_tag }}.zip .

      # --- Publish as a Release (permanent download link) ---
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          files: RaceManager-${{ steps.version.outputs.new_tag }}.zip

      # --- Also attach to the run as an artifact (optional) ---
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaceManager-${{ steps.version.outputs.new_tag }}
          path: package/
