name: Build RaceManager Package

# NO VERSION INPUT. There is nothing to choose: the release is named by the
# RM_BUILD in the source, so bumping is an edit to the files and a commit, not a
# dropdown at release time. Offering the choice here is what let a tag be
# invented that the tree it tagged did not agree with.
on:
  workflow_dispatch:

# AN EXPLICIT BLOCK SETS EVERY SCOPE IT DOES NOT NAME TO none, which is the
# trap here rather than the two lines themselves. `contents: write` alone is
# enough to push the tag and create the release, so the release worked -- and
# the Upload artifact step at the bottom then failed on its FINALIZE call with a
# bare 403, after the bytes had already gone up and a digest had been logged.
# Nothing in that error says "permissions", and the release it follows has
# already succeeded, so the run goes red for a step that is optional.
#
#   contents  push the tag, create the release
#   actions   finalize an artifact attached to the run
permissions:
  contents: write
  actions: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # NODE 24. All three actions in this file were on the Node 20 runtime,
        # which GitHub deprecated in September 2025 -- the runner forced them
        # onto Node 24 anyway and annotated every run to say so. Forced is not
        # supported, so the majors are moved rather than left to be carried.
        #
        # Nothing in how they are CALLED changed. checkout v5 is the runtime
        # move, v6 writes credentials to a separate file, v7 is ESM and blocks
        # checking out fork PRs for pull_request_target and workflow_run -- and
        # this workflow is workflow_dispatch only, so that last one cannot
        # apply. upload-artifact v5 and v6 are the same runtime move twice over
        # and v7 adds an optional `archive` input nothing here passes.
        # action-gh-release v3 is a pure runtime move; tag_name and files are
        # untouched.
        #
        # They need runner 2.327.1 or newer, which ubuntu-latest has long been
        # past. A self-hosted runner would need checking first.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # --- The version comes FROM THE SOURCE, and is checked, not invented ---
      #
      # This step used to bump a tag with github-tag-action, which computes the
      # next number from the newest existing tag and applies it to whatever
      # commit it is running on. The build stamps inside the files are edited by
      # hand. Nothing compared the two, and they diverged exactly as you would
      # expect: v0.12.0 was tagged one commit early, onto a tree still stamped
      # 0.11.0, and a release went out named for a version it did not contain.
      # That is the failure the note in server/RaceManager/main.lua warns about,
      # reached by the one route nobody was watching.
      #
      # So the source is the authority. RM_BUILD names the release, all five
      # stamps must agree before anything is built, and a tag that already
      # exists on another commit is a hard stop rather than a silent overwrite.
      - name: Resolve and verify version
        id: version
        run: |
          fail() { echo "::error::$1"; exit 1; }
          read_one() { sed -n "$1" "$2" | head -1; }
          v=$(read_one "s/^local RM_BUILD = '\([^']*\)'.*/\1/p" server/RaceManager/main.lua)
          c=$(read_one "s/^local RM_BUILD = '\([^']*\)'.*/\1/p" lua/ge/extensions/raceManager.lua)
          a=$(read_one "s/.*APP_BUILD = '\([^']*\)';.*/\1/p"    ui/modules/apps/RaceManager/app.js)
          j=$(read_one 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' ui/modules/apps/RaceManager/app.json)
          d=$(read_one "s/.*RELEASE_NAME = 'RaceManager-v\([^']*\)\.zip'.*/\1/p" tools/deploy.py)
          echo "server=$v client=$c app.js=$a app.json=$j deploy.py=$d"
          [ -n "$v" ] || fail "could not read RM_BUILD from server/RaceManager/main.lua"

          # THE FIVE THAT HAVE TO AGREE. A release whose pieces disagree shows a
          # mismatch banner in the app and behaves like a stale install.
          for other in "$c" "$a" "$j" "$d"; do
            [ "$other" = "$v" ] || fail "build stamps disagree: server says '$v', another says '$other'"
          done

          tag="v$v"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            at=$(git rev-list -n1 "$tag")
            [ "$at" = "$GITHUB_SHA" ] || fail "$tag already exists on $at, not on this commit. Bump the version, or move the tag deliberately."
          fi
          echo "new_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $GITHUB_SHA"

      - name: Create tag
        run: |
          tag="${{ steps.version.outputs.new_tag }}"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi

      # --- Build the package with the SAME tool the deploy uses ---
      #
      # tools/deploy.py, not a file list written out again here. This step used
      # to name every file it zipped, and by the time anybody looked it was
      # missing three: lua/ge/extensions/raceManager/derby.lua and render.lua on
      # the client, and server/RaceManager/derby.lua. A release built from it
      # would have mounted, failed its first `require`, and left the mod simply
      # absent -- no error a server owner could act on.
      #
      # deploy.py had already learned this and DISCOVERS the files. Two lists of
      # the same thing is one list that goes stale, and this is the copy nobody
      # runs day to day, so it is the copy that goes stale first.
      #
      # --build-only writes package/ and dist/ and touches no server.
      - name: Build package
        run: python3 tools/deploy.py --build-only

      # --- Ship the license with the download ---
      #
      # The zip is extracted straight into Resources/ and then passed around
      # between server owners, so it is the only copy of the mod most people
      # ever see. MIT asks for the notice to travel with it; at the package
      # root it sits beside Client/ and Server/ without landing in either.
      - name: Copy license
        run: cp LICENSE package/

      # --- Create the main downloadable zip ---
      - name: Create main zip
        run: |
          cd package
          zip -r ../RaceManager-${{ steps.version.outputs.new_tag }}.zip .

      # --- Show what shipped, and fail if anything is missing ---
      #
      # The paths in this package are install instructions: they are copied
      # as-is into a server's Resources/. Client and Server are CAPITALISED,
      # and that is not cosmetic -- Linux, where a good share of servers are
      # hosted, cares, and lowercase folders drop into Resources/ looking
      # installed and are simply never read. It matched on Windows, which is
      # why it survived this long.
      #
      # EVERY MODULE IS CHECKED BY NAME, not just the entry points. A missing
      # module is the failure this whole step exists for: the mod mounts, the
      # require throws, and the mod is absent with nothing to go on. Add a line
      # here when a module is added -- discovery builds the package, but a
      # release is worth one deliberate list of what must be in it.
      - name: Verify package layout
        run: |
          unzip -l RaceManager-${{ steps.version.outputs.new_tag }}.zip
          unzip -l package/Client/RaceManager.zip
          fail() { echo "::error::$1"; exit 1; }
          test -f package/Client/RaceManager.zip             || fail "Client/RaceManager.zip missing (check the folder case)"
          for f in lua/ge/extensions/raceManager.lua                    lua/ge/extensions/raceManager/derby.lua                    lua/ge/extensions/raceManager/drag.lua                    lua/ge/extensions/raceManager/render.lua                    scripts/raceManager/modScript.lua                    ui/modules/apps/RaceManager/app.html                    ui/modules/apps/RaceManager/app.js                    ui/modules/apps/RaceManager/app.json; do
            unzip -l package/Client/RaceManager.zip | grep -q " $f$"               || fail "$f is missing from the client zip: the mod will mount and then fail its require"
          done
          for f in main.lua derby.lua drag.lua; do
            test -f "package/Server/RaceManager/$f"               || fail "Server/RaceManager/$f missing (check the folder case)"
          done

      # --- Publish as a Release ---
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          files: RaceManager-${{ steps.version.outputs.new_tag }}.zip

      # --- Also attach to the run as an artifact (optional) ---
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: RaceManager-${{ steps.version.outputs.new_tag }}
          path: package/
